{{ define "main" }}
<section>
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ with .Pages.ByDate.Reverse }}
  <div class="page-list">
    {{ range . }}
    <div class="page-item">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p class="meta">{{ .Params.author }} — {{ .Date | time.Format "January 2, 2006" }}</p>
      <p>{{ .Summary | plainify }}</p>
    </div>
    {{ end }}
  </div>
  {{ end }}
</section>
{{ end }}
