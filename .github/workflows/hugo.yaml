# Build the Hugo site and publish it to the docs S3 bucket behind CloudFront.
name: Deploy Hugo site

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.143.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "https://cloudboss.co/"

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DOCS_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3 and invalidate CloudFront
        if: github.event_name != 'pull_request'
        env:
          BUCKET: ${{ vars.DOCS_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
        run: |
          aws s3 sync public/ "s3://$BUCKET/site/" --delete
          # The site's cache keys live under the site/ prefix; /* clears the
          # whole distribution, which is fine for an infrequently-built site.
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*'
